<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Where to buy stock, ETF, crypto ....</title>
    <style>
      :root {
        --paper: #f3eee4;
        --ink: #1c1914;
        --mute: #6d675c;
        --line: #d4cbb8;
        --card: #fffdf7;
        --green: #0f4d3a;
        --green-soft: #dceae3;
        --hit: #efe6c8;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--paper); color: var(--ink); }
      body {
        font: 16px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        min-height: 100vh;
      }
      main { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 56px 0 80px; text-align: center; }
      h1 { margin: 0 0 36px; font-size: 42px; letter-spacing: -0.03em; font-weight: 650; }
      .lede { margin: 0 auto 28px; max-width: 38em; color: var(--mute); }
      .search { position: relative; }
      .search-row { position: relative; z-index: 3; }
      .filters {
        display: flex;
        gap: 12px;
        margin-top: 12px;
        text-align: left;
      }
      .filters label {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--mute);
        font-weight: 600;
      }
      #nat {
        font: inherit;
        font-size: 15px;
        letter-spacing: 0;
        text-transform: none;
        font-weight: 400;
        color: var(--ink);
        border: 1px solid var(--ink);
        background: var(--card);
        border-radius: 2px;
        padding: 10px 12px;
        min-width: 240px;
        outline: none;
      }
      #nat:focus { box-shadow: 4px 4px 0 var(--green); }
      #q {
        display: block;
        width: 100%;
        border: 1px solid var(--ink);
        background: var(--card);
        color: var(--ink);
        border-radius: 2px;
        padding: 16px 52px 16px 18px;
        font: inherit;
        font-size: 18px;
        text-align: left;
        outline: none;
      }
      #q:focus { box-shadow: 4px 4px 0 var(--green); }
      #go {
        position: absolute;
        top: 50%;
        right: 10px;
        transform: translateY(-50%);
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      #go:hover { background: var(--green-soft); color: var(--green); }
      #go svg { display: block; width: 20px; height: 20px; }
      #suggest {
        position: absolute;
        z-index: 2;
        left: 0; right: 0; top: calc(100% - 1px);
        margin: 0; padding: 6px 0;
        list-style: none;
        background: var(--card);
        border: 1px solid var(--ink);
        max-height: 360px;
        overflow: auto;
      }
      #suggest[hidden] { display: none; }
      #suggest button {
        display: grid;
        grid-template-columns: 88px 72px 1fr 132px auto;
        gap: 12px;
        align-items: baseline;
        width: 100%;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        padding: 10px 16px;
        font: inherit;
        cursor: pointer;
      }
      #suggest button[aria-selected="true"], #suggest button:hover { background: var(--hit); }
      #suggest .tk { font-variant-numeric: tabular-nums; font-weight: 650; }
      #suggest .kind { color: var(--green); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
      #suggest .nm { color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #suggest .isin { color: var(--mute); font-variant-numeric: tabular-nums; font-size: 12px; }
      #suggest .nb { color: var(--green); font-size: 13px; white-space: nowrap; }
      .meta { margin: 14px 0 0; color: var(--mute); font-size: 13px; }
      #result { margin-top: 36px; text-align: left; }
      #result[hidden] { display: none; }
      .instrument {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        align-items: baseline;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }
      .instrument h2 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
      .instrument .isin { font-variant-numeric: tabular-nums; color: var(--mute); }
      .chip {
        display: inline-block;
        padding: 2px 8px;
        background: var(--green-soft);
        color: var(--green);
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .count { margin: 16px 0 12px; color: var(--mute); }
      table.listings {
        width: 100%;
        border-collapse: collapse;
        background: var(--card);
      }
      table.listings th,
      table.listings td {
        text-align: left;
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      table.listings th {
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--mute);
        font-weight: 600;
      }
      table.listings td a { color: inherit; text-decoration: none; }
      table.listings td a:hover { border-bottom: 1px solid var(--ink); }
      table.listings tr:last-child td { border-bottom: 0; }
      table.listings td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
      table.listings td.na { color: var(--mute); }
      table.listings td.remark { color: var(--mute); font-size: 13px; line-height: 1.35; max-width: 28em; white-space: pre-line; }
      .note { margin: 10px 0 0; color: var(--mute); font-size: 13px; text-align: left; }
      .empty { margin-top: 28px; color: var(--mute); }
    </style>
  </head>
  <body>
    <main>
      <h1>Where to buy stock, ETF, crypto ....</h1>
      <div class="search">
        <div class="search-row">
          <input id="q" type="search" placeholder="IWDA, Apple, IE00B4L5Y983…" autocomplete="off" autofocus />
          <button id="go" type="button" aria-label="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-3.5-3.5" />
            </svg>
          </button>
          <ul id="suggest" hidden></ul>
        </div>
        <div class="filters">
          <label>Nationality
            <select id="nat">
              <option value="">Any</option>
            </select>
          </label>
        </div>
      </div>
      <p id="meta" class="meta"></p>
      <section id="result" hidden></section>
      <p id="empty" class="empty" hidden>No broker in this repository lists it.</p>
    </main>
    <script>
      const q = document.getElementById("q");
      const nat = document.getElementById("nat");
      const goBtn = document.getElementById("go");
      const suggest = document.getElementById("suggest");
      const meta = document.getElementById("meta");
      const result = document.getElementById("result");
      const empty = document.getElementById("empty");
      let hits = [];
      let cursor = -1;
      let timer = 0;
      let shown = "";

      const nationality = () => nat.value || "";
      const withNat = (path) => {
        const n = nationality();
        return n ? `${path}${path.includes("?") ? "&" : "?"}nat=${encodeURIComponent(n)}` : path;
      };

      const esc = (s) =>
        String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      fetch("/api/stats")
        .then((r) => r.json())
        .then((s) => {
          meta.textContent = `${s.instruments.toLocaleString("en-US")} instruments · ${s.listings.toLocaleString("en-US")} listings · ${s.brokers} brokers`;
        });

      fetch("/api/countries")
        .then((r) => r.json())
        .then((rows) => {
          const saved = localStorage.getItem("nat") || "";
          for (const row of rows) {
            const opt = document.createElement("option");
            opt.value = row.code;
            opt.textContent = row.name;
            nat.appendChild(opt);
          }
          if (saved && [...nat.options].some((o) => o.value === saved)) nat.value = saved;
        });

      function renderSuggest() {
        if (!hits.length) {
          suggest.hidden = true;
          suggest.innerHTML = "";
          return;
        }
        suggest.hidden = false;
        suggest.innerHTML = hits
          .map((h, i) => {
            const label = h.brokers > 1 ? `${h.brokers} brokers` : "1 broker";
            const type = String(h.type || "").toUpperCase();
            const kind = type && type !== "OTHER" ? type : "";
            return `<li><button type="button" data-i="${i}" aria-selected="${i === cursor}">
              <span class="tk">${esc(h.ticker || "—")}</span>
              <span class="kind">${esc(kind)}</span>
              <span class="nm">${esc(h.name || h.isin || h.key)}</span>
              ${h.isin ? `<span class="isin">${esc(h.isin)}</span>` : ""}
              <span class="nb">${label}</span>
            </button></li>`;
          })
          .join("");
      }

      async function lookup(query) {
        const r = await fetch(withNat(`/api/search?q=${encodeURIComponent(query)}`));
        hits = await r.json();
        cursor = hits.length ? 0 : -1;
        renderSuggest();
      }

      function pick(hit) {
        if (!hit) return;
        q.value = hit.ticker || hit.isin || hit.key;
        suggest.hidden = true;
        history.replaceState(null, "", `#${encodeURIComponent(hit.key)}`);
        show(hit.key);
      }

      async function show(key) {
        shown = key;
        empty.hidden = true;
        const r = await fetch(withNat(`/api/instrument?key=${encodeURIComponent(key)}`));
        if (!r.ok) {
          result.hidden = true;
          empty.hidden = false;
          return;
        }
        const d = await r.json();
        const crypto = String(d.type || "").toUpperCase() === "CRYPTO";
        const rows = d.soldBy
          .flatMap((b) => {
            const listed = b.listings.length ? b.listings : [{ exchange: "", currency: "" }];
            return listed.map((l) => ({
              url: b.url || "",
              family: b.family || b.name || "",
              planRank: Number(b.planRank) || 0,
              brokerName: b.name || "",
              exchange: crypto ? "" : l.exchange || "—",
              currency: l.currency || "N/A",
              spread: l.spread || "N/A",
              perShare: l.perShare || "N/A",
              perOrder: l.perOrder || "N/A",
              perOrderMin: Boolean(l.perOrderMin),
              remark: l.remark || "",
            }));
          })
          .sort(
            (a, b) =>
              a.family.localeCompare(b.family, "en") ||
              a.exchange.localeCompare(b.exchange, "en") ||
              a.currency.localeCompare(b.currency, "en") ||
              a.planRank - b.planRank ||
              a.brokerName.localeCompare(b.brokerName, "en")
          );
        const merged = [];
        for (const row of rows) {
          const hit = merged.find(
            (g) =>
              g.family === row.family &&
              g.exchange === row.exchange &&
              g.currency === row.currency &&
              g.spread === row.spread &&
              g.perShare === row.perShare &&
              g.perOrder === row.perOrder &&
              g.perOrderMin === row.perOrderMin &&
              g.remark === row.remark
          );
          if (hit) hit.n += 1;
          else merged.push({ ...row, n: 1 });
        }
        const brokerCell = (row) => {
          const label = row.n > 1 && row.family ? row.family : row.brokerName;
          return row.url
            ? `<a href="${esc(row.url)}" target="_blank" rel="noreferrer">${esc(label)}</a>`
            : esc(label);
        };
        const cell = (v, min) => {
          const text = v || "N/A";
          const zero = text === "0" || Number(text) === 0;
          const mark = min && text !== "N/A" && !zero ? "<sup>**</sup>" : "";
          return `<td class="num${text === "N/A" ? " na" : ""}">${esc(text)}${mark}</td>`;
        };
        const body = merged
          .map(
            (row) =>
              `<tr><td>${brokerCell(row)}</td>${crypto ? "" : `<td>${esc(row.exchange)}</td>`}<td>${esc(row.currency)}</td>${cell(row.spread)}${cell(row.perShare)}${cell(row.perOrder, row.perOrderMin)}<td class="remark">${esc(row.remark)}</td></tr>`
          )
          .join("");
        result.hidden = false;
        result.innerHTML = `
          <div class="instrument">
            <h2>${esc(d.ticker || d.isin || d.key)}</h2>
            ${d.type ? `<span class="chip">${esc(d.type)}</span>` : ""}
            <span>${esc(d.name)}</span>
            ${d.isin ? `<span class="isin">${esc(d.isin)}</span>` : ""}
          </div>
          <p class="count">Sold by ${d.soldBy.length} broker${d.soldBy.length > 1 ? "s" : ""}${nationality() ? ` that accept ${nat.options[nat.selectedIndex].text}` : ""}</p>
          <table class="listings">
            <thead>
              <tr>
                <th>broker</th>
                ${crypto ? "" : "<th>exchange</th>"}
                <th>currency</th>
                <th>spread*</th>
                <th>commission / share (USD)*</th>
                <th>commission / order (USD)*</th>
                <th>remark</th>
              </tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
          <p class="note">* Round trip (buy and sell). Includes broker fees, taxes, and the market spread.</p>
          ${merged.some((row) => row.perOrderMin && row.perOrder && row.perOrder !== "0")
            ? `<p class="note">** Minimum of the proportional brokerage fees.</p>`
            : ""}`;
      }

      q.addEventListener("input", () => {
        clearTimeout(timer);
        const v = q.value.trim();
        if (!v) {
          hits = [];
          renderSuggest();
          return;
        }
        timer = setTimeout(() => lookup(v), 80);
      });

      q.addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown") {
          e.preventDefault();
          if (!hits.length) return;
          cursor = (cursor + 1) % hits.length;
          renderSuggest();
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          if (!hits.length) return;
          cursor = (cursor - 1 + hits.length) % hits.length;
          renderSuggest();
        } else if (e.key === "Enter") {
          e.preventDefault();
          submit();
        } else if (e.key === "Escape") {
          suggest.hidden = true;
        }
      });

      async function submit() {
        if (!hits.length && q.value.trim()) await lookup(q.value.trim());
        if (hits[cursor] || hits[0]) pick(hits[cursor] || hits[0]);
        else if (q.value.trim()) show(q.value.trim().toUpperCase());
      }

      goBtn.addEventListener("click", submit);

      nat.addEventListener("mousedown", () => {
        suggest.hidden = true;
      });

      nat.addEventListener("change", () => {
        localStorage.setItem("nat", nationality());
        empty.textContent = nationality()
          ? "No broker that accepts this nationality lists it."
          : "No broker in this repository lists it.";
        suggest.hidden = true;
        if (shown && !result.hidden) show(shown);
      });

      suggest.addEventListener("mousedown", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        pick(hits[Number(btn.dataset.i)]);
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest(".search")) suggest.hidden = true;
      });

      const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
      if (hash) {
        q.value = hash;
        show(hash);
      }
    </script>
  </body>
</html>
